name: Release
on:
  push:
    branches:
    - stable
    - experimental
jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
    - name: Install Dependencies
      run: npm ci
    - name: Run Tests
      run: npm test
