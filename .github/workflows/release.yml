name: Release
on:
    push:
        branches:
            - stable
            - experimental
permissions:
    contents: write
jobs:
    Release:
        runs-on: self-hosted
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: npm
            - name: Install Dependencies
              run: npm ci
            - name: Run Tests
              run: npm test
            - name: Publish
              run: npm run publish
              env:
                  GITHUB_TOKEN: ${{ secrets.github_token }}
