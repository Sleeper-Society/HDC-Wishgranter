name: Documentation
on: 
    push:
        paths: ["./src/*.jsons.d.ts"]
    pull_request:
        paths: ["./src/*.jsons.d.ts"]

concurrency: # prevent concurrent deploys doing strange things
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
    update_wishgranter_website:
        runs-on: self-hosted
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with: 
                repository: 'Sleeper-Society/wishgranter.dev'
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Build Website
              run: npm run build
            - name: Deploy to neocities
              uses: bcomnes/deploy-to-neocities@v3
              with:
                api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
                cleanup: true
                neocities_supporter: false # set this to true if you have a supporter account and want to bypass unsuported files filter.
                preview_before_deploy: true # print a deployment plan prior to waiting for files to upload.
                dist_dir: public
