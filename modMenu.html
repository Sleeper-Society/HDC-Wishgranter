<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hyperspace Deck Command: Wishgranter</title>
    <link href="modMenu.css" rel="stylesheet" type="text/css" media="all" />
    <style id="font"></style>
    <script src="dist/renderer/loadingBar.js" type="module"></script>
    <script src="dist/renderer/modEntry.js" type="module"></script>
    <script src="dist/renderer/modMenu.js" type="module"></script>
  </head>
  <body>
    <template>
      <link href="modEntry.css" rel="stylesheet" type="text/css" media="all" />
      <h2 id="name"></h2>
      <div><img id="icon" /></div>
      <p id="description"></p>
      <input type="checkbox" id="enabled" checked />
      <p id="version"></p>
      <button id="move_up">↑</button>
      <button id="move_down">↓</button>
    </template>
    <label mod_menu for="mods_file_location_input">Mods folder:</label>
    <input mod_menu type="text" id="mods_file_location_input" />
    <button
      mod_menu
      class="file_location_button"
      for="mods_file_location_input"
    >
      <img src="folder.svg" />
    </button>
    <div mod_menu id="modlist">
      <mod-entry></mod-entry>
    </div>
    <div mod_menu>
      <img id="hyperspace_box_art" />
    </div>
    <label mod_menu for="hyperspace_file_location_input"
      >Hyperspace Deck Command Installation:</label
    >
    <input mod_menu type="text" id="hyperspace_file_location_input" />
    <button mod_menu class="steam_button"><img src="steam.svg" /></button>
    <button
      mod_menu
      class="file_location_button"
      for="hyperspace_file_location_input"
    >
      <img src="folder.svg" />
    </button>

    <button mod_menu id="start_game_button" disabled>Start Game</button>
    <loading-bar mod_menu id="loading_bar"></loading-bar>
  </body>
</html>
