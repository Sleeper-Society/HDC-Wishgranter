<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Hyperspace Deck Command: Wishgranter</title>
        <link href="modMenu.css" rel="stylesheet" type="text/css" media="all" />
        <link
            href="loadingBar.css"
            rel="stylesheet"
            type="text/css"
            media="all"
        />
        <script src="dist/mod_menu/loadingBar.js" type="module"></script>
        <script src="dist/mod_menu/modEntry.js" type="module"></script>
        <script src="dist/mod_menu/modMenu.js" type="module"></script>
    </head>
    <body>
        <template>
            <link
                href="loadingBar.css"
                rel="stylesheet"
                type="text/css"
                media="all"
            />
            <link
                href="modEntry.css"
                rel="stylesheet"
                type="text/css"
                media="all"
            />

            <h2 id="name"></h2>
            <img id="icon" />
            <p id="description"></p>
            <input type="checkbox" id="enabled" checked />
            <p id="version"></p>
            <button id="move-up">↑</button>
            <button id="move-down">↓</button>
            <loading-bar id="mod-loading-bar"></loading-bar>
        </template>
        <label mod_menu for="mods-file-location-input">Mods folder:</label>
        <input mod_menu type="text" id="mods-file-location-input" />
        <button
            mod_menu
            class="file_location_button"
            for="mods-file-location-input"
        >
            <img src="folder.svg" />
        </button>
        <div mod_menu id="modlist">
            <mod-entry mod_type="basegame"></mod-entry>
            <mod-entry mod_type="wishgranter"></mod-entry>
        </div>
        <div mod_menu>
            <img id="hyperspace-box-art" />
        </div>
        <label mod_menu for="hyperspace-file-location-input"
            >Hyperspace Deck Command Installation:</label
        >
        <input mod_menu type="text" id="hyperspace-file-location-input" />
        <button mod_menu class="steam_button"><img src="steam.svg" /></button>
        <button
            mod_menu
            class="file-location_button"
            for="hyperspace-file-location-input"
        >
            <img src="folder.svg" />
        </button>

        <button mod_menu id="start-game-button" disabled>Start Game</button>
        <loading-bar mod_menu id="loading_bar"></loading-bar>
    </body>
</html>
